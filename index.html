<style>
/* 夜の調べ部屋：紺の机に、明るいスマホの画面。見つけたワナは朱、正しいものは青と ✓ */
:root{
  --bg:#151a2e; --paper:#222944; --paper2:#2c3456; --ink:#f3f4f8; --ink2:#b9bfd6; --line:#ffffff26;
  --acc:#ffc857; --acc2:#b8861d; --ok:#7cc7ff; --bad:#ff9a76; --gold:#ffd166;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:20px;margin:0;letter-spacing:.04em}
h1 small{display:block;font-size:12px;letter-spacing:0;color:var(--ink2);font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.dots{display:flex;gap:6px;flex:1;max-width:140px;align-items:flex-end}
.dots i{flex:1;height:6px;border-radius:3px;border:1px solid var(--ink2);box-sizing:border-box}
.dots i.on{height:10px;background:var(--acc);border-color:var(--acc)}.dots i.done{background:var(--ink2)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border-radius:16px;background:var(--acc);color:#2a1f05;font-weight:800;font-size:17px;padding:6px 16px;text-align:center;box-shadow:0 4px 0 var(--acc2);line-height:1.35}
button.main small{font-size:12px;font-weight:500}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--acc2)}
button.main.alt{background:#9fd8ff;color:#0c2236;box-shadow:0 4px 0 #3d7fae}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{color:var(--ink2);cursor:default;border-style:dashed}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a,.src a{color:var(--acc);display:inline-flex;align-items:center;min-height:44px}
.scene{background:var(--paper2);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.6;margin:0}
.scene b{color:var(--acc)}
.ask{font-size:15px;font-weight:800;margin:0;text-align:center}
/* スマホの画面（架空のお店・アプリ）。中の部品は全部ボタンで、押して「ここがワナ」と答える */
.phone{background:#fbfaf6;color:#1d2230;border-radius:24px;border:6px solid #3a4266;box-shadow:0 10px 30px #0009;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
.phone .bar{background:#eceae2;color:#2b3040;font-size:13px;font-weight:700;padding:10px 14px;border-bottom:1px solid #d6d3c8}
.phone .body{display:flex;flex-direction:column;gap:6px;padding:10px}
.pt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;min-height:44px;border-radius:10px;padding:8px 10px;border:2px solid transparent;position:relative;line-height:1.45;font-size:15px;color:#1d2230;overflow-wrap:anywhere}
.pt:hover{border-color:#c9c4b4}
.pt .sx{display:block;font-size:13px;color:#454b5c}
.k-img{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px}
.k-img .em{font-size:40px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:#eeeae0;border-radius:12px;flex:none}
.k-price{font-size:24px;font-weight:800;color:#a3260b}
.k-price .sx{font-size:13px;font-weight:500}
.k-small{font-size:13px;color:#454b5c}
.k-small.tiny{font-size:11px}
.k-banner{background:#fde2d6;color:#8a2408;font-weight:800;text-align:center}
.k-pop{background:#2b2f45;color:#fff;font-size:13px;border-radius:999px;text-align:center}
.k-btn{background:#c2410c;color:#fff;font-weight:800;text-align:center;font-size:16px;min-height:48px}
.k-btn2{background:#fff;border-color:#9aa0b0;text-align:center;font-weight:700}
.k-link{font-size:12px;color:#1d4ed8;text-decoration:underline;text-align:center;min-height:44px}
.k-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e4e1d6;border-radius:0}
.k-row .sx{display:inline;font-size:15px;color:#1d2230;white-space:nowrap}
.k-total{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.k-total .sx{display:inline;font-size:17px;color:#a3260b}
.k-check,.k-radio{display:flex;gap:8px;align-items:flex-start}
.k-check .box,.k-radio .box{font-size:20px;line-height:1.1;flex:none}
.ad{position:absolute;right:6px;top:2px;font-size:9px;color:#5c6170;font-weight:500}
/* 押した結果：ちがう ✕＋破線、ワナ ✓＋太い枠。色だけにしない */
.pt.bad{border:2px dashed #b23a0c;background:#fff1ea!important;color:#5a1a04!important}
.pt.bad .sx,.pt.hit .sx,.pt.out .sx{color:inherit!important}
.pt.bad::before{content:"✕ ";font-weight:800;color:#b23a0c}
.pt.hit{border:3px solid #0b5fa5;background:#e6f2ff!important;color:#0d2a4a!important}
.pt.hit::before{content:"✓ ワナ ";font-weight:800;color:#0b5fa5;display:block;font-size:12px}
.pt.out{border:2px dotted #6b7080;background:#f2f0ea!important;color:#3a3f4d!important;cursor:default}
.pt.out::after{content:"ヒント：ここではない";display:block;font-size:11px;color:#454b5c}
.pt.dim{cursor:default}
.nowana.bad{border:2px dashed var(--bad)}
.nowana.bad::before{content:"✕ ";color:var(--bad)}
.names{display:grid;gap:8px}
.names button{all:unset;box-sizing:border-box;cursor:pointer;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper);padding:8px 12px;font-weight:800;font-size:16px;text-align:center}
.names button small{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.names button.bad{border-style:dashed;border-color:var(--bad);color:var(--ink2);cursor:default}
.names button.bad::before{content:"✕ ";color:var(--bad)}
.names button.out{border-style:dotted;color:var(--ink2);cursor:default}
.tipbox{background:#2f2a1a;border:1px dashed var(--acc);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.6;margin:0}
.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #0006;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{font-size:20px;font-weight:800;text-align:center}
.verdict .nm{font-size:22px;font-weight:800;text-align:center;color:var(--ok)}
.verdict .cat{font-size:12px;color:var(--ink2);text-align:center}
.verdict p{margin:0;font-size:14px;line-height:1.7}
.verdict .honest{border:2px dashed var(--ok);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:2px}
.verdict .honest b{font-size:13px;color:var(--ink2)}
.verdict .help{font-size:13px;color:var(--ink2)}
.verdict p b{color:var(--acc)}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:var(--ink2)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
/* ホーム */
.title{font-weight:800;font-size:36px;letter-spacing:.1em;text-align:center;margin:6px 0 0;text-shadow:0 0 18px #ffc85755}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.demo{display:flex;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.res{display:flex;flex-direction:column;gap:6px}
.res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.dex{display:grid;grid-template-columns:1fr;gap:8px}
.dex div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.dex div b{font-size:15px;color:var(--ok)}
.dex div.no{border-style:dashed;color:var(--ink2)}
.dex div.no b{color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal span{color:var(--ink2);padding:4px 0}
.cal .d{min-height:44px;border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);box-sizing:border-box;font-size:13px;color:var(--ink)}
.cal .d.today{border:2px solid var(--acc)}
.cal button.d{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;border-radius:10px;border:2px dotted var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.cal .d i{font-style:normal;font-size:12px;line-height:1}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000bb}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--acc);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f3f5f0;color:#151a2e;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0008;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
.achs{display:flex;flex-direction:column;gap:8px}
.achs div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.achs div.got{border-color:var(--gold);background:#3a3522}
.achs b{font-size:15px}.achs div.got b{color:var(--gold)}
.achs small{font-size:12px;color:var(--ink2)}
.achs i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ok) var(--p),var(--line) var(--p))}
.newach{border:1px solid var(--gold);background:#3a3522;font-weight:800;border-radius:14px;padding:12px;text-align:center;font-size:15px;line-height:1.6}
.src{font-size:13px;line-height:1.7;color:var(--ink2);margin:0}
html.a11y-cvd .pt.bad{border-width:3px}
html.a11y-cvd .pt.hit{border-width:4px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:is(button,a):focus-visible{outline:3px solid #1a5fd0!important;outline-offset:2px!important}
</style>

<script id="a11y-script">

  $("back").onclick = home; $("home").onclick = home; $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => startRun("h");
  if ($("copy")) $("copy").onclick = async () => { try { if (navigator.share) await navigator.share({ text: txt }); else await navigator.clipboard.writeText(txt); toast("コピーしました"); } catch (e) {} };
  bindFooter();
  say(`結果。${rec.r.map((x) => "星" + starsOf(x)).join("、")}。`);
}

function ach() {
  const L = achList(load());
  show(`<header><button class="icon" id="back" aria-label="ホームへもどる">←</button><h1>実績 ${L.filter((a) => a.done).length}/${L.length}</h1><span></span></header>
    <div class="achs">${L.map((a) => `<div class="${a.done ? "got" : ""}"><b>${a.done ? "🏅" : "🔒"} ${esc(a.name)}</b><small>${esc(a.desc)}${a.done ? "（できた）" : `（いま ${a.cur}/${a.goal}）`}</small><i style="--p:${Math.round((a.cur / a.goal) * 100)}%" aria-hidden="true"></i></div>`).join("")}</div>${footer()}`);
  $("back").onclick = home; bindFooter();
}
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s);
  ym = ym || k.slice(0, 7);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), first = new Date(Date.UTC(y, m - 1, 1)), nd = new Date(Date.UTC(y, m, 0)).getUTCDate(), pad = first.getUTCDay();
  const prev = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 7), next = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7);
  let cells = "";
  for (let i = 0; i < pad; i++) cells += "<span></span>";
  for (let d = 1; d <= nd; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, mk = s.days[key] ? "★" : s.adays[key] ? "↺" : "", hk = s.hdays[key] ? "▲" : "";
    const lab = `${m}月${d}日${s.days[key] ? "・今日の5画面を遊んだ" : s.adays[key] ? "・あとから遊んだ" : ""}${s.hdays[key] ? "・上級" : ""}`;
    if (late.includes(key)) cells += `<button class="d" data-late="${key}" aria-label="${m}月${d}日・あとから遊べる">${d}<i>▶</i></button>`;
    else cells += `<div class="d${key === k ? " today" : ""}" aria-label="${lab}">${d}<i>${mk}${hk}</i></div>`;
  }
  const st = streak(s.days);
  show(`<header><button class="icon" id="back" aria-label="ホームへもどる">←</button><h1>カレンダー<small>★今日の5画面　↺あとから　▲上級　▶あとから遊べる日</small></h1><span></span></header>
    <div class="row"><button class="sub" id="pm"${prev < EPOCH.slice(0, 7) ? " disabled" : ""}>← 前の月</button><b style="align-self:center">${y}年${m}月</b><button class="sub" id="nm"${next > k.slice(0, 7) ? " disabled" : ""}>次の月 →</button></div>
    <div class="cal">${"日月火水木金土".split("").map((w) => `<span>${w}</span>`).join("")}${cells}</div>
    <p class="note">遊んだ日は合わせて${playedDays(s)}日${st >= 1 ? `・${st}日続けて` : ""}。遊べなかった日は、7日前まで「あとから」遊べます。</p>${footer()}`);
  $("back").onclick = home; $("pm").onclick = () => cal(prev); $("nm").onclick = () => cal(next);
  app.querySelectorAll("[data-late]").forEach((b) => (b.onclick = () => startRun("a", b.dataset.late)));
  bindFooter();
}

  show(`<header><button class="icon" id="back" aria-label="ホームへもどる">←</button><h1>このゲームについて</h1><span></span></header>
    <p class="src">ダークパターンは、人をだましたり、思っていない選択をさせたりする画面の仕掛けです。ワナの名前と分け方は、消費者庁の「いわゆるダークパターン」の調査（2025年4月、33種類・9つの仲間）から18種類を選んで使っています。</p>
    <p class="src">出典：<a href="https://www.caa.go.jp/policies/future/icprc/research_002/" target="_blank" rel="noopener">消費者庁 消費者政策の調査</a>・<a href="https://deceptive.design/types" target="_blank" rel="noopener">Deceptive Patterns（Harry Brignull）</a>・<a href="https://www.ftc.gov/reports/bringing-dark-patterns-light" target="_blank" rel="noopener">米国 FTC（2022）</a></p>
    <p class="src">画面に出るお店・アプリ・商品・人は、すべて作り話です。実在の会社とは関係ありません。法律の相談にはなりません。</p>
    <p class="src">買い物や契約で困ったときは、消費者ホットライン「188」（いやや）に電話すると、近くの消費生活センターにつながります。</p>
    <p class="src">記録はこの端末の中だけに置き、外へ送りません。</p>
    <button class="sub" id="home">ホームへ</button>${footer()}`);
  $("back").onclick = home; $("home").onclick = home; bindFooter();
}
